name: Hardware-free tests

on: [push, pull_request]

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python examples/amd_dump_flash.py --help
      - run: divination --help
      - run: python -m divination --help

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

  linux-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-generic
      - name: Compile module against installed distro headers
        run: |
          kernel_headers=$(printf '%s\n' /usr/src/linux-headers-*-generic | sort -V | tail -n 1)
          test -d "$kernel_headers"
          make -C driver/linux KDIR="$kernel_headers" W=1
